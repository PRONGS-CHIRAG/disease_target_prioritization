# Model, split and evaluation configuration.
#
# Validated by target_prioritization.config.ModelConfig.

version: 1

# Context.md §33 requires the random seed to be recorded for every experiment.
random_seed: 42

# ---------------------------------------------------------------------------
# Validation split (Context.md §19.4)
#
# Rows must NOT be split randomly. The same disease appearing in both train and
# test lets the model memorise which targets belong to that disease rather than
# learn what makes a target promising — Context.md §16 lists this explicitly.
# ---------------------------------------------------------------------------
split:
  strategy: leave_one_disease_out
  group_column: disease_id
  n_folds: null
  notes: >
    With ten diseases, leave-one-disease-out gives ten folds and reports
    per-disease metrics directly, which §19.3 requires anyway. Switch to
    disease_group once the disease count grows, and to temporal once a
    historical snapshot exists for §30.7.

# ---------------------------------------------------------------------------
# Rule-based baseline (Context.md §17.1)
#
# Weights are ILLUSTRATIVE, not scientifically validated. The value of this
# baseline is that it is fully transparent: if it ranks known Parkinson's
# targets near the top, the data pipeline is probably sound. Validated to
# sum to 1.0 by ModelConfig.
#
# This is the §17.1 target formula. It is NOT yet reachable: the pathways,
# expression and network terms need Reactome, GTEx and STRING, which Context.md
# §28 Step 9 schedules after the baseline works. Use milestone_1_weights until
# those are integrated.
# ---------------------------------------------------------------------------
baseline_weights:
  genetics: 0.30
  pathways: 0.20
  expression: 0.15
  network: 0.15
  literature: 0.10
  druggability: 0.10

# ---------------------------------------------------------------------------
# Milestone 1 baseline (Context.md §36) — Open Targets only.
#
# Differs from baseline_weights above because §36 restricts Milestone 1 to Open
# Targets, and three of the §17.1 dimensions cannot be built from it:
#   - pathways:   the OT `reactome` datasource has ZERO rows for Parkinson's
#   - expression: OT carries expression_atlas association evidence, not tissue
#                 TPM, so there is no disease-relevant-tissue term without GTEx
#   - network:    needs STRING
#
# Two dimensions replace them, both justified by the data rather than by taste:
#
#   evidence_diversity (0.20) — Context.md §14.9 argues diversity may beat
#     volume, and for Parkinson's it plainly does: the five established genes
#     (LRRK2 7, GBA1 6, SNCA 6, PARK7 5, PRKN 5) hold the most distinct evidence
#     types of any candidate.
#
#   functional (0.15) — CRISPR screens, mouse knockouts and expression atlas
#     evidence, which OT does carry for this disease.
#
# Literature is held at 0.15 deliberately. 71% of the 8,727 candidates
# (6,196) have literature evidence and nothing else, and europepmc sits at
# 0.98-0.99 for every well-known gene, so it is simultaneously the most common
# and least discriminating signal (Context.md §32.2).
# ---------------------------------------------------------------------------
milestone_1_weights:
  genetics: 0.40
  evidence_diversity: 0.20
  functional: 0.15
  literature: 0.15
  druggability: 0.10

# Number of distinct evidence types at which the diversity term saturates.
# 4 is chosen because only 16 of 8,727 candidates exceed it — above that the
# term would stop discriminating and start rewarding a handful of outliers.
evidence_diversity_saturation: 4

# ---------------------------------------------------------------------------
# Models (Context.md §17)
# Train in this order; do not skip ahead. A gradient-boosted model that cannot
# beat the weighted baseline usually indicates a data problem, not a modelling
# one.
# ---------------------------------------------------------------------------
models:
  weighted_baseline:
    enabled: true
    type: rule_based

  logistic_regression:
    enabled: true
    type: sklearn
    params:
      penalty: l2
      C: 1.0
      class_weight: balanced
      max_iter: 2000
      solver: lbfgs

  random_forest:
    enabled: true
    type: sklearn
    params:
      n_estimators: 500
      max_depth: null
      min_samples_leaf: 5
      class_weight: balanced_subsample
      n_jobs: -1

  xgboost:
    enabled: true
    type: xgboost
    params:
      objective: "binary:logistic"
      eval_metric: aucpr
      n_estimators: 600
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 5
      reg_lambda: 1.0
      # Positives are rare; set from the training fold at fit time.
      scale_pos_weight: null

  lightgbm_ranker:
    enabled: false
    type: lightgbm
    params:
      objective: lambdarank
      metric: ndcg
      ndcg_eval_at: [5, 10, 20]
      n_estimators: 600
      learning_rate: 0.05
      num_leaves: 31
    notes: >
      Context.md §17.6 — attempt learning-to-rank only after the classification
      baseline is working and its ranking metrics are understood.

# ---------------------------------------------------------------------------
# Evaluation (Context.md §19)
# ---------------------------------------------------------------------------
evaluation:
  # §19.3: compute per disease, then aggregate. A single global metric across
  # all disease-target pairs hides the fact that a few data-rich diseases can
  # carry the average.
  aggregate_by: disease_id

  ranking_metrics:
    - precision_at_5
    - precision_at_10
    - recall_at_10
    - recall_at_20
    - map
    - mrr
    - ndcg_at_10
    - ndcg_at_20
    - hit_rate

  classification_metrics:
    - roc_auc
    # §19.1: PR-AUC is the headline number here. Positives are rare, and
    # ROC-AUC looks flattering under class imbalance.
    - pr_auc
    - precision
    - recall
    - f1
    - brier_score

  primary_metric: ndcg_at_10

  baselines_for_comparison:
    # Context.md §16: used only here, never as a training feature.
    - open_targets_overall_score
    - weighted_baseline
    - random_ranking

  # Context.md §32.2 — report metrics with and without the literature group, to
  # measure how much of the performance is publication bias rather than biology.
  ablations:
    - name: no_literature
      drop_groups: [literature]
    - name: no_network
      drop_groups: [network]
    - name: genetics_only
      keep_groups: [genetics]

  output_dir: reports/evaluation
